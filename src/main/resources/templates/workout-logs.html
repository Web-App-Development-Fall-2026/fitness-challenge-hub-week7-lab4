<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Workout Logs | FitSquad Hub</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container py-4">

<h1 class="mb-4">Athlete Workout Logs</h1>

<form th:action="@{/workout-logs}" method="get" class="row g-2 mb-4">
    <input type="hidden" name="sort" th:value="${sort}">
    <input type="hidden" name="direction" th:value="${direction}">
    <input type="hidden" name="size" th:value="${pageSize}">

    <div class="col-md-4">
        <input type="text" name="search" class="form-control" placeholder="Search value..." th:value="${search}">
    </div>
    <div class="col-md-4">
        <select name="filterType" class="form-select">
            <option value="all" th:selected="${filterType == 'all'}">All Workout Logs</option>
            <option value="athlete" th:selected="${filterType == 'athlete'}">By Athlete Name</option>
            <option value="calories" th:selected="${filterType == 'calories'}">By Min Calories Burned</option>
            <option value="highestCalories" th:selected="${filterType == 'highestCalories'}">Highest Calorie Burn (JPQL)</option>
            <option value="intensityDuration" th:selected="${filterType == 'intensityDuration'}">By Intensity &amp; Min 25m Duration (JPQL)</option>
        </select>
    </div>
    <div class="col-md-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary">Search</button>
        <a th:href="@{/workout-logs}" class="btn btn-outline-secondary">Reset</a>
    </div>
</form>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>
            <a class="text-white text-decoration-none"
               th:href="@{/workout-logs(page=0,size=${pageSize},sort='athleteName',direction=${(sort == 'athleteName' and direction == 'ASC') ? 'DESC' : 'ASC'},search=${search},filterType=${filterType})}">
                Athlete <span th:if="${sort == 'athleteName'}" th:text="${direction == 'ASC'} ? '↑' : '↓'"></span>
            </a>
        </th>
        <th>
            <a class="text-white text-decoration-none"
               th:href="@{/workout-logs(page=0,size=${pageSize},sort='workoutDate',direction=${(sort == 'workoutDate' and direction == 'ASC') ? 'DESC' : 'ASC'},search=${search},filterType=${filterType})}">
                Date <span th:if="${sort == 'workoutDate'}" th:text="${direction == 'ASC'} ? '↑' : '↓'"></span>
            </a>
        </th>
        <th>
            <a class="text-white text-decoration-none"
               th:href="@{/workout-logs(page=0,size=${pageSize},sort='durationMinutes',direction=${(sort == 'durationMinutes' and direction == 'ASC') ? 'DESC' : 'ASC'},search=${search},filterType=${filterType})}">
                Duration <span th:if="${sort == 'durationMinutes'}" th:text="${direction == 'ASC'} ? '↑' : '↓'"></span>
            </a>
        </th>
        <th>
            <a class="text-white text-decoration-none"
               th:href="@{/workout-logs(page=0,size=${pageSize},sort='caloriesBurned',direction=${(sort == 'caloriesBurned' and direction == 'ASC') ? 'DESC' : 'ASC'},search=${search},filterType=${filterType})}">
                Calories <span th:if="${sort == 'caloriesBurned'}" th:text="${direction == 'ASC'} ? '↑' : '↓'"></span>
            </a>
        </th>
        <th>
            <a class="text-white text-decoration-none"
               th:href="@{/workout-logs(page=0,size=${pageSize},sort='intensityLevel',direction=${(sort == 'intensityLevel' and direction == 'ASC') ? 'DESC' : 'ASC'},search=${search},filterType=${filterType})}">
                Intensity <span th:if="${sort == 'intensityLevel'}" th:text="${direction == 'ASC'} ? '↑' : '↓'"></span>
            </a>
        </th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="log : ${workoutLogs}">
        <td th:text="${log.athleteName}"></td>
        <td th:text="${log.workoutDate}"></td>
        <td th:text="${log.durationMinutes}"></td>
        <td th:text="${log.caloriesBurned}"></td>
        <td th:text="${log.intensityLevel}"></td>
    </tr>
    <tr th:if="${#lists.isEmpty(workoutLogs)}">
        <td colspan="5" class="text-center">No workout logs found.</td>
    </tr>
    </tbody>
</table>

<div class="d-flex justify-content-between align-items-center mt-3">
    <p class="mb-0">
        Page <span th:text="${currentPage + 1}"></span>
        of <span th:text="${totalPages}"></span>
        (<span th:text="${totalElements}"></span> total workout logs)
    </p>

    <nav th:if="${totalPages > 0}">
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link" th:href="@{/workout-logs(page=0,size=${pageSize},sort=${sort},direction=${direction},search=${search},filterType=${filterType})}">First</a>
            </li>
            <li class="page-item" th:classappend="${!hasPrevious} ? 'disabled'">
                <a class="page-link" th:href="@{/workout-logs(page=${currentPage - 1},size=${pageSize},sort=${sort},direction=${direction},search=${search},filterType=${filterType})}">Previous</a>
            </li>
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link" th:href="@{/workout-logs(page=${i},size=${pageSize},sort=${sort},direction=${direction},search=${search},filterType=${filterType})}" th:text="${i + 1}"></a>
            </li>
            <li class="page-item" th:classappend="${!hasNext} ? 'disabled'">
                <a class="page-link" th:href="@{/workout-logs(page=${currentPage + 1},size=${pageSize},sort=${sort},direction=${direction},search=${search},filterType=${filterType})}">Next</a>
            </li>
            <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                <a class="page-link" th:href="@{/workout-logs(page=${totalPages - 1},size=${pageSize},sort=${sort},direction=${direction},search=${search},filterType=${filterType})}">Last</a>
            </li>
        </ul>
    </nav>
</div>

<div th:replace="~{fragments/footer :: footer}">
    
</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">FitSquad Hub - Register Coach</title>

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Application CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>

    <!-- Reusable Navbar Fragment -->
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-xl-6">

                <div class="text-center mb-4">
                    <h1 class="display-6 fw-bold text-white tracking-tight">Register a <span class="text-gradient">Coach</span></h1>
                    <p class="text-secondary small">Add a certified trainer to the `COACHES` table so they can lead new challenges.</p>
                </div>

                <div class="form-card">
                    <form th:action="@{/create-coach}" th:object="${coach}" method="post" novalidate>

                        <div class="mb-3">
                            <label for="name" class="form-label text-white fw-semibold small">Coach Full Name <span class="text-danger">*</span></label>
                            <input type="text" id="name" class="form-control form-control-dark" th:field="*{name}"
                                   th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="e.g., Marcus Vance">
                            <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('name')}">
                                <i class="bi bi-exclamation-circle-fill"></i>
                                <span th:errors="*{name}">Name error</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="specialty" class="form-label text-white fw-semibold small">Discipline Specialty <span class="text-danger">*</span></label>
                            <select id="specialty" class="form-select form-select-dark" th:field="*{specialty}"
                                    th:classappend="${#fields.hasErrors('specialty')} ? 'is-invalid' : ''">
                                <option value="">-- Choose Specialty --</option>
                                <option th:each="spec : ${specialties}" th:value="${spec}" th:text="${spec}"></option>
                            </select>
                            <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('specialty')}">
                                <i class="bi bi-exclamation-circle-fill"></i>
                                <span th:errors="*{specialty}">Specialty error</span>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-8">
                                <label for="certification" class="form-label text-white fw-semibold small">Certifications <span class="text-danger">*</span></label>
                                <input type="text" id="certification" class="form-control form-control-dark" th:field="*{certification}"
                                       th:classappend="${#fields.hasErrors('certification')} ? 'is-invalid' : ''" placeholder="e.g., CSCS, NASM-CPT">
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('certification')}">
                                    <i class="bi bi-exclamation-circle-fill"></i>
                                    <span th:errors="*{certification}">Certification error</span>
                                </div>
                            </div>

                            <div class="col-md-4">
                                <label for="experienceYears" class="form-label text-white fw-semibold small">Experience (Yrs) <span class="text-danger">*</span></label>
                                <input type="number" id="experienceYears" class="form-control form-control-dark" th:field="*{experienceYears}"
                                       th:classappend="${#fields.hasErrors('experienceYears')} ? 'is-invalid' : ''" placeholder="10">
                                <div class="invalid-feedback-custom" th:if="${#fields.hasErrors('experienceYears')}">
                                    <i class="bi bi-exclamation-circle-fill"></i>
                                    <span th:errors="*{experienceYears}">Experience error</span>
                                </div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="avatarUrl" class="form-label text-white fw-semibold small">Avatar Image URL <span class="text-muted fw-normal">(Optional)</span></label>
                            <input type="url" id="avatarUrl" class="form-control form-control-dark" th:field="*{avatarUrl}"
                                   placeholder="https://images.unsplash.com/...">
                        </div>

                        <div class="d-flex justify-content-end gap-3">
                            <a th:href="@{/coaches}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-join rounded-pill px-4">Save Coach</button>
                        </div>

                    </form>
                </div>

            </div>
        </div>
    </main>

    <!-- Reusable Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
